<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Application Details</h1>
        <button id="backButton">Back</button>
    </header>

    <main class="details-page">

        <section>
            <h2 id="companyName"></h2>
            <p id="jobTitle"></p>
        </section>

        <section>
            <div>
                <strong>Location</strong>
                <p id="location"></p>
            </div>

            <div>
                <strong>Date Applied</strong>
                <p id="dateApplied"></p>
            </div>

            <div>
                <strong>Job Type</strong>
                <p id="jobType"></p>
            </div>

            <div>
                <strong>Status</strong>
                <select id="statusSelect"></select>
                <button id="updateStatusButton">Update Status</button>
            </div>
        </section>

        <section class="notes-section">

            <div class="notes-header">
                <h3>Notes</h3>

                <button id="editNotesButton" class="icon-button" title="Edit notes" aria-label="Edit notes">
                <span>✎</span>
                </button>
            </div>

            <p id="notes"></p>

            <div id="notesEditor" hidden>
                <textarea id="notesInput" rows="6"></textarea>

                <div class="notes-actions">
                    <button id="cancelNotesButton" class="cancel-notes-button">Cancel</button>
                    <button id="saveNotesButton" class="save-notes-button">Save Changes</button>
                </div>
            </div>

            <p id="notesMessage"></p>

        </section>

        <section>
            <p>Created: <span id="createdAt"></span></p>
            <p>Last Updated: <span id="updatedAt"></span></p>
        </section>

        <p id="successMessage"></p>

    </main>
<script src="js/applicationDetails.js"></script>
</body>
</html>
